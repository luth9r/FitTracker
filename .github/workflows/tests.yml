name: .NET CI with Tests and Coverage

on:
  push:
    branches:
      - 'feature/**'
      - 'develop'
      - 'main'
  pull_request:
    branches:
      - main

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Install ReportGenerator tool
        run: |
          echo "::notice::Installing ReportGenerator tool..."
          dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Restore dependencies
        working-directory: ./backend
        run: |
          echo "::notice::Restoring .NET dependencies..."
          dotnet restore

      - name: Build
        working-directory: ./backend
        run: |
          echo "::notice::Building .NET solution..."
          dotnet build --no-restore --configuration Release

      - name: Run all tests with coverage
        working-directory: ./backend
        run: |
          echo "::notice::Running .NET tests with coverage..."
          dotnet test --no-restore --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./Tests/TestResults

      - name: Generate coverage report
        working-directory: ./backend
        run: |
          echo "::notice::Generating coverage report..."
          mkdir -p Tests/CoverageReport
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"Tests/TestResults/**/coverage.cobertura.xml" \
            -targetdir:./Tests/CoverageReport \
            -reporttypes:"Cobertura;HtmlInline_AzurePipelines"

      - name: Debug - Verify coverage file
        working-directory: ./backend
        run: |
          echo "📂 Coverage report structure:"
          ls -lah Tests/CoverageReport/
          echo ""
          if [ -f "Tests/CoverageReport/Cobertura.xml" ]; then
            echo "✅ Found Cobertura.xml"
            head -10 Tests/CoverageReport/Cobertura.xml
          else
            echo "❌ Cobertura.xml NOT FOUND"
            exit 1
          fi

      - name: Code Coverage Report
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: backend/Tests/CoverageReport/Cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/Tests/CoverageReport/Cobertura.xml
          flags: backend
          fail_ci_if_error: true
          verbose: true

      - name: Upload test coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: backend/Tests/CoverageReport/
          retention-days: 30
          if-no-files-found: warn