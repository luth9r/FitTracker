services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fittracker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 2
    networks:
      - fittracker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fittracker-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      Jwt__Key: ${Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__EmailVerificationTokenValidityInMinutes: ${Jwt__EmailVerificationTokenValidityInMinutes}
      Jwt__TokenValidityInDays: ${Jwt__TokenValidityInDays}

      # App Settings
      App__VerificationLinkBase: ${App__VerificationLinkBase}
      
      # Google OAuth
      Google__ClientId: ${Google__ClientId}
      Google__ClientSecret: ${Google__ClientSecret}
      Google__RedirectUri: ${Google__RedirectUri}
    ports:
      - "${BACKEND_PORT}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health/db-connection"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 40s
    networks:
      - fittracker-network
    restart: unless-stopped

    # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fittracker-web
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fittracker-network
    restart: unless-stopped
    
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fittracker-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - fittracker-network
    restart: unless-stopped

networks:
  fittracker-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: