<!-- Hidden fields to prevent browser autofill -->
<div style="position: absolute; top: -9999px; left: -9999px;">
  <input type="text" name="fake_email" />
  <input type="password" name="fake_password" />
</div>

<div class="form-container">
  <!-- Username -->
  <app-auth-input-field
    [labelKey]="'REGISTER.USERNAME'"
    [placeholderKey]="'REGISTER.USERNAME_PLACEHOLDER'"
    fieldName="username"
    type="text"
    [(value)]="formData.username"
    [hasError]="hasUsernameError"
    (focus)="onFieldFocus('username')"
    (blur)="onFieldBlur()"
    (validateOnChange)="onValidateChange('username', $event)"
  >
  </app-auth-input-field>

  <!-- Username validation checklist -->
  <app-validation-checklist
    [validationState]="usernameValidationState"
    translationPrefix="REGISTER.VALIDATION.USERNAME_"
    [shouldShow]="showUsernameValidation"
  >
  </app-validation-checklist>

  <!-- Email -->
  <app-auth-input-field
    [labelKey]="'LOGIN.EMAIL'"
    [placeholderKey]="'LOGIN.EMAIL_PLACEHOLDER'"
    fieldName="email"
    type="email"
    [(value)]="formData.email"
    [hasError]="hasEmailError"
    (focus)="onFieldFocus('email')"
    (blur)="onFieldBlur()"
    (validateOnChange)="onValidateChange('email', $event)"
  >
  </app-auth-input-field>

  <!-- Email validation checklist -->
  <app-validation-checklist
    [validationState]="emailValidationState"
    translationPrefix="REGISTER.VALIDATION.EMAIL_"
    [shouldShow]="showEmailValidation"
  >
  </app-validation-checklist>

  <!-- Password -->
  <app-auth-input-field
    [labelKey]="'LOGIN.PASSWORD'"
    [placeholderKey]="'LOGIN.PASSWORD_PLACEHOLDER'"
    fieldName="password"
    type="password"
    [hasError]="hasPasswordError"
    [(value)]="formData.password"
    [(showPassword)]="showPassword"
    (focus)="onFieldFocus('password')"
    (blur)="onFieldBlur()"
    (validateOnChange)="onValidateChange('password', $event)"
  >
  </app-auth-input-field>

  <!-- Password validation checklist -->
  <app-validation-checklist
    [validationState]="passwordValidationState"
    translationPrefix="REGISTER.VALIDATION.PASSWORD_"
    [shouldShow]="showPasswordValidation"
  >
  </app-validation-checklist>

  <!-- Confirm Password -->
  <app-auth-input-field
    [labelKey]="'LOGIN.CONFIRM_PASSWORD'"
    [placeholderKey]="'LOGIN.CONFIRM_PASSWORD_PLACEHOLDER'"
    fieldName="confirmPassword"
    type="password"
    [hasError]="hasConfirmPasswordError"
    [(value)]="formData.confirmPassword"
    [(showPassword)]="showConfirmPassword"
    (focus)="onFieldFocus('confirmPassword')"
    (blur)="onFieldBlur()"
    (validateOnChange)="onValidateChange('confirmPassword', $event)"
  >
  </app-auth-input-field>

  <!-- Confirm Password validation checklist -->
  <app-validation-checklist
    [validationState]="confirmPasswordValidationState"
    translationPrefix="REGISTER.VALIDATION.CONFIRM_"
    [shouldShow]="showConfirmPasswordValidation"
  >
  </app-validation-checklist>

  <!-- Submit -->
  <button type="submit" class="submit-btn" [disabled]="isLoading" (click)="onSubmit()">
    <span *ngIf="!isLoading">
      {{ 'LOGIN.SUBMIT_BUTTON_SIGNUP' | translate }}
    </span>
    <span *ngIf="isLoading">
      {{ 'LOGIN.LOADING' | translate }}
    </span>
  </button>
</div>
