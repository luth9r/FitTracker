<div class="modal-container">
  <div class="modal-header">
    <h2>{{ 'VERIFICATION.TITLE' | translate }}</h2>
    <button class="close-btn" (click)="onClose()" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M2 2l12 12M14 2L2 14"
        />
      </svg>
    </button>
  </div>

  <div class="modal-body">
    <div class="icon-container">
      <svg
        class="email-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
        />
      </svg>
    </div>

    <p class="message">
      {{ 'VERIFICATION.MESSAGE' | translate }}
    </p>
    <p class="email-display">{{ email }}</p>

    <p class="instruction">
      {{ 'VERIFICATION.INSTRUCTION' | translate }}
    </p>
  </div>

  <div class="modal-footer">
    <button class="resend-btn" [disabled]="isResending" (click)="onResend()">
      <span *ngIf="!isResending">
        {{ 'VERIFICATION.RESEND_BUTTON' | translate }}
      </span>
      <span *ngIf="isResending">
        {{ 'VERIFICATION.RESENDING' | translate }}
      </span>
    </button>

    <button class="close-footer-btn" (click)="onClose()">
      {{ 'VERIFICATION.CLOSE_BUTTON' | translate }}
    </button>
  </div>
</div>
